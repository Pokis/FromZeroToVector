<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coordinates for Meaning — Interactive Presentation</title>
  <style>
    :root {
      --bg-0: #050811;
      --bg-1: #0f172a;
      --bg-2: #1e293b;
      --text-0: #f8fafc;
      --text-1: #cbd5e1;
      --text-2: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #818cf8;
      --accent-3: #34d399;
      --warn: #fbbf24;
      --danger: #f87171;
      --border: rgba(148, 163, 184, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at 20% 15%, #111e38 0%, var(--bg-0) 72%);
      color: var(--text-0);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Clean Minimal Topbar */
    .deck-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 28px;
      background: rgba(10, 15, 29, 0.85);
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-2);
    }

    .top-btn {
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: var(--accent);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s;
    }
    .top-btn:hover { background: rgba(56, 189, 248, 0.28); color: #fff; }

    .progress-track { height: 4px; background: rgba(255,255,255,0.06); width: 100%; }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent-3));
      width: 5%;
      transition: width 0.25s ease;
    }

    .slide-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 56px;
      overflow-y: auto;
    }

    .slide-container {
      max-width: 1240px;
      width: 100%;
      animation: fadeSlide 0.28s ease;
    }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .slide-header { margin-bottom: 24px; }
    .slide-title {
      font-size: clamp(28px, 3.2vw, 44px);
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1.15;
    }
    .slide-subtitle {
      font-size: clamp(16px, 1.45vw, 20px);
      color: var(--text-2);
      margin-top: 6px;
    }

    /* Step-by-Step Reveal Animation Classes */
    .step-item {
      opacity: 0;
      transform: translateY(16px) scale(0.985);
      transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    .step-item.revealed {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }
    .step-item.current-step-focus {
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.22);
      border-color: rgba(56, 189, 248, 0.55) !important;
    }

    .step-svg {
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .step-svg.revealed { opacity: 1; }

    /* Visual Layouts */
    .hero-center { text-align: center; padding: 16px 0; }
    .constellation-badge {
      width: 72px; height: 72px; border-radius: 20px; margin: 0 auto 18px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: grid; place-items: center; font-size: 32px; font-weight: 900; color: #050811;
      box-shadow: 0 0 36px rgba(56, 189, 248, 0.45);
    }
    .hero-title {
      font-size: clamp(40px, 5vw, 64px);
      font-weight: 900;
      letter-spacing: -0.03em;
      background: linear-gradient(90deg, #fff, #38bdf8, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero-sub { font-size: 22px; color: var(--text-1); margin-top: 10px; }

    .cards-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
    .cards-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .cards-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .two-col-slide { display: grid; grid-template-columns: 1.1fr 1fr; gap: 24px; align-items: start; }
    .flow-vertical { display: flex; flex-direction: column; gap: 16px; }
    .steps-column { display: flex; flex-direction: column; gap: 14px; }

    .v-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 22px;
    }
    .v-icon { font-size: 30px; margin-bottom: 8px; }
    .v-card h3 { font-size: 19px; color: var(--accent); margin-bottom: 6px; }
    .v-card p { font-size: 15.5px; line-height: 1.55; color: var(--text-1); }

    .step-badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    .visual-box {
      background: #060a14;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
    }

    /* Compare Row & Bubbles (Slide 2) */
    .compare-row {
      display: grid; grid-template-columns: 1fr auto 1fr; gap: 18px; align-items: center;
    }
    .chat-bubble {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 22px;
    }
    .fail-border { border-color: rgba(248, 113, 113, 0.5); }
    .bubble-label { font-size: 12px; color: var(--text-2); text-transform: uppercase; font-weight: 700; }
    .bubble-text { font-size: 20px; font-weight: 700; margin-top: 6px; }
    .vs-arrow {
      background: var(--bg-2); padding: 8px 14px; border-radius: 999px;
      font-size: 13px; color: var(--warn); font-weight: 700;
    }
    .hl-red { color: var(--danger); text-decoration: underline; }
    .hl-green { color: var(--accent-3); text-decoration: underline; }
    .reveal-banner {
      display: inline-block;
      background: rgba(52, 211, 153, 0.1);
      border: 1px solid rgba(52, 211, 153, 0.4);
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 16px;
    }
    .doc-pill {
      font-size: 20px; font-weight: 800; color: #fff; margin-top: 6px;
    }

    /* Axis pills & formula */
    .axis-pills { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
    .ax-pill {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 600;
    }
    .formula-box {
      display: flex; align-items: center; justify-content: center; gap: 16px;
      background: #050811; padding: 18px; border-radius: 12px; font-size: 18px; font-weight: 700;
      margin-top: 10px; flex-wrap: wrap;
    }
    .formula-arrow { color: var(--accent-3); }

    .mini-code {
      background: #050811; border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 12px; font-family: 'JetBrains Mono', Consolas, monospace;
      font-size: 13px; line-height: 1.5; margin-top: 10px; color: var(--text-0);
    }

    /* Diagram nodes */
    .diagram-box {
      background: #050811; border: 1px solid var(--border); border-radius: 10px; padding: 14px;
    }
    .d-node {
      background: rgba(30, 41, 59, 0.7); border: 1px solid var(--border);
      padding: 10px 14px; border-radius: 8px; font-size: 14px; text-align: center;
    }
    .d-arrow { text-align: center; color: var(--accent); font-size: 13px; font-weight: 700; margin: 8px 0; }
    .d-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .d-pill {
      padding: 6px 12px; border-radius: 999px; background: var(--bg-2); font-size: 13px; color: var(--text-2);
    }
    .d-pill.win {
      background: rgba(52, 211, 153, 0.2); border: 1px solid var(--accent-3); color: var(--accent-3); font-weight: 700;
    }

    /* Standout Demo & Live Code Hero Styling */
    .demo-hero {
      background: radial-gradient(circle at center, rgba(56, 189, 248, 0.14) 0%, rgba(15, 23, 42, 0.9) 70%);
      border: 2px solid var(--accent);
      border-radius: 18px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 0 40px rgba(56, 189, 248, 0.18);
    }
    .demo-badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--accent), var(--accent-3));
      color: #050811;
      font-weight: 900;
      font-size: 13px;
      letter-spacing: 0.08em;
      padding: 6px 16px;
      border-radius: 999px;
      margin-bottom: 14px;
    }
    .demo-actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    .btn-launch {
      display: inline-block;
      background: linear-gradient(135deg, var(--accent), var(--accent-3));
      color: #050811;
      font-weight: 800;
      font-size: 16px;
      padding: 14px 26px;
      border-radius: 10px;
      text-decoration: none;
      box-shadow: 0 0 24px rgba(52, 211, 153, 0.35);
      transition: transform 0.15s;
    }
    .btn-launch:hover { transform: scale(1.03); }
    .btn-launch.btn-alt {
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
    }

    /* Code Slide Box */
    pre.code-box {
      background: #04070e;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
      font-family: 'JetBrains Mono', Consolas, monospace;
      font-size: 13.5px;
      line-height: 1.52;
      overflow-x: auto;
    }
    .code-step { display: block; padding: 4px 6px; border-radius: 6px; border-left: 3px solid transparent; }
    .code-step.current-step-focus {
      background: rgba(56, 189, 248, 0.09);
      border-left-color: var(--accent);
    }
    .kw { color: #38bdf8; font-weight: 600; }
    .ty { color: #34d399; }
    .st { color: #fbbf24; }
    .cm { color: #64748b; font-style: italic; }
    .mono { font-family: 'JetBrains Mono', Consolas, monospace; }

    /* Footer with Step-by-Step Dots */
    .deck-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 28px;
      background: rgba(10, 15, 29, 0.9);
      border-top: 1px solid var(--border);
    }
    .step-dots { display: flex; align-items: center; gap: 8px; }
    .step-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: rgba(148, 163, 184, 0.25);
      cursor: pointer; transition: all 0.2s;
    }
    .step-dot.done { background: var(--accent); }
    .step-dot.current { background: var(--accent-3); transform: scale(1.3); box-shadow: 0 0 8px var(--accent-3); }

    .nav-btn {
      background: var(--bg-2); color: var(--text-0); border: 1px solid var(--border);
      padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;
    }
    .nav-btn:hover { border-color: var(--accent); }
  </style>
</head>
<body>
  <div class="deck-topbar">
    <div><strong>Coordinates for Meaning</strong></div>
    <div style="display:flex; gap:10px; align-items:center;">
      <button class="top-btn" onclick="openPresenterWindow()" title="Opens your private speaker notes & glossary in a separate window for your 2nd screen!">
        🎤 Pop Out Speaker Screen (2nd Monitor)
      </button>
      <a class="top-btn" href="../visualizer/index.html" target="_blank">
        🌌 Open Interactive Visualizer
      </a>
    </div>
  </div>
  <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>

  <div class="slide-stage">
    <div class="slide-container" id="slideMount"></div>
  </div>

  <div class="deck-footer">
    <div style="display:flex; align-items:center; gap:16px;">
      <span id="slideCounter" style="font-size:13px; color:var(--text-2);">Slide 1 of 18</span>
      <div class="step-dots" id="stepDotsContainer"></div>
      <span id="stepHintLabel" style="font-size:12px; color:var(--accent);"></span>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="nav-btn" onclick="stepBackward()">← Back</button>
      <button class="nav-btn" onclick="revealAllStepsOnSlide()" title="Reveal all steps on current slide (Down Arrow)">Show All Steps (↓)</button>
      <button class="nav-btn" onclick="stepForward()" style="background:rgba(56,189,248,0.2); border-color:var(--accent);">Next Step / Slide →</button>
    </div>
  </div>

  <script src="slides-data.js"></script>
  <script>
    const slides = window.TALK_SLIDES;
    let currentSlideIdx = 0;
    let currentStep = 0;

    // Cross-window sync for Dual-Screen Presenter Console
    const syncChannel = ('BroadcastChannel' in window) ? new BroadcastChannel('embeddings_talk_sync') : null;

    function broadcastState() {
      const payload = {
        type: 'SLIDE_STATE',
        slideIdx: currentSlideIdx,
        step: currentStep,
        timestamp: Date.now()
      };
      if (syncChannel) syncChannel.postMessage(payload);
      try { localStorage.setItem('embeddings_talk_state', JSON.stringify(payload)); } catch {}
    }

    if (syncChannel) {
      syncChannel.onmessage = (ev) => {
        if (!ev.data) return;
        if (ev.data.type === 'CMD_NEXT') stepForward(false);
        else if (ev.data.type === 'CMD_PREV') stepBackward(false);
        else if (ev.data.type === 'CMD_REVEAL_ALL') revealAllStepsOnSlide(false);
        else if (ev.data.type === 'CMD_GOTO') goToSlideAndStep(ev.data.slideIdx, ev.data.step, false);
        else if (ev.data.type === 'REQUEST_STATE') broadcastState();
      };
    }

    window.addEventListener('storage', (ev) => {
      if (ev.key === 'embeddings_talk_cmd' && ev.newValue) {
        try {
          const cmd = JSON.parse(ev.newValue);
          if (cmd.action === 'NEXT') stepForward(false);
          else if (cmd.action === 'PREV') stepBackward(false);
          else if (cmd.action === 'REVEAL_ALL') revealAllStepsOnSlide(false);
          else if (cmd.action === 'GOTO') goToSlideAndStep(cmd.slideIdx, cmd.step, false);
        } catch {}
      }
    });

    function openPresenterWindow() {
      window.open(
        'presenter.html',
        'SpeakerPresenterWindow',
        'width=1100,height=780,menubar=no,toolbar=no,location=no,status=no'
      );
      setTimeout(broadcastState, 300);
    }

    function renderSlide(idx, initialStep = 0) {
      currentSlideIdx = Math.max(0, Math.min(slides.length - 1, idx));
      const s = slides[currentSlideIdx];
      // For demo slides with 1 step, show immediately
      currentStep = s.type === 'demo' && s.stepsCount === 1 ? 1 : initialStep;

      const mount = document.getElementById('slideMount');
      const showHeader = s.type !== 'title';
      mount.innerHTML = `
        ${showHeader ? `
          <div class="slide-header">
            <h1 class="slide-title">${s.title}</h1>
            <p class="slide-subtitle">${s.subtitle}</p>
          </div>
        ` : ''}
        ${s.html}
      `;

      applyStepVisibility();
      updateFooter();
      broadcastState();
    }

    function applyStepVisibility() {
      const mount = document.getElementById('slideMount');
      mount.querySelectorAll('[data-step]').forEach(el => {
        const st = parseInt(el.getAttribute('data-step'));
        el.classList.toggle('revealed', st <= currentStep);
        el.classList.toggle('current-step-focus', st === currentStep);
      });
    }

    function updateFooter() {
      const s = slides[currentSlideIdx];
      document.getElementById('slideCounter').textContent = `Slide ${currentSlideIdx + 1} of ${slides.length}`;
      document.getElementById('progressBar').style.width = `${((currentSlideIdx + 1) / slides.length) * 100}%`;

      const dotsEl = document.getElementById('stepDotsContainer');
      dotsEl.innerHTML = '';
      for (let i = 1; i <= s.stepsCount; i++) {
        const dot = document.createElement('div');
        dot.className = 'step-dot ' + (i < currentStep ? 'done' : i === currentStep ? 'current' : '');
        dot.title = `Step ${i}`;
        dot.onclick = () => goToSlideAndStep(currentSlideIdx, i, true);
        dotsEl.appendChild(dot);
      }

      const hint = document.getElementById('stepHintLabel');
      if (currentStep < s.stepsCount) {
        hint.textContent = `Step ${currentStep} of ${s.stepsCount} (Press → for next step)`;
      } else {
        hint.textContent = `All ${s.stepsCount} steps shown (Press → for next slide)`;
      }
    }

    function stepForward(shouldBroadcast = true) {
      const s = slides[currentSlideIdx];
      if (currentStep < s.stepsCount) {
        currentStep++;
        applyStepVisibility();
        updateFooter();
        if (shouldBroadcast) broadcastState();
      } else if (currentSlideIdx < slides.length - 1) {
        renderSlide(currentSlideIdx + 1, 0);
      }
    }

    function stepBackward(shouldBroadcast = true) {
      if (currentStep > 0) {
        currentStep--;
        applyStepVisibility();
        updateFooter();
        if (shouldBroadcast) broadcastState();
      } else if (currentSlideIdx > 0) {
        const prevSlide = slides[currentSlideIdx - 1];
        renderSlide(currentSlideIdx - 1, prevSlide.stepsCount);
      }
    }

    function revealAllStepsOnSlide(shouldBroadcast = true) {
      const s = slides[currentSlideIdx];
      currentStep = s.stepsCount;
      applyStepVisibility();
      updateFooter();
      if (shouldBroadcast) broadcastState();
    }

    function goToSlideAndStep(slideIdx, step, shouldBroadcast = true) {
      renderSlide(slideIdx, step);
    }

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); stepForward(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); stepBackward(); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); revealAllStepsOnSlide(); }
      else if (e.key === 'p' || e.key === 'P') { openPresenterWindow(); }
      else if (e.key === 'f' || e.key === 'F') {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
      }
    });

    renderSlide(0, 0);
  </script>
</body>
</html>
